name: Laboratoire — essais du modèle

# Essaie des variantes du modèle « horizon » et enregistre les résultats dans la
# table `experiences`, sans toucher aux scores publiés dans l'appli.
# Lancé à la main (onglet Actions), automatiquement sur une PR qui modifie le modèle, et
# chaque mois pour RE-TESTER l'IA de volatilité : l'appli ne la montre que si le dernier
# test est probant (garde-fou dans publish.py).
on:
  schedule:
    - cron: "17 4 2 * *"   # le 2 de chaque mois, 4 h 17 UTC
  pull_request:
    paths: ["experiences.py", "modele_horizon.py", "modele_risque.py", "backtest_risque.py", "modele_regime.py", "modele_cnn.py", "fondamentaux_sec.py", ".github/workflows/experiences.yml"]
  workflow_dispatch:
    inputs:
      experiences:
        description: "Expériences à lancer (ex. alpha,alpha_secteur), ou « toutes »"
        default: "toutes"
        required: false

concurrency:
  group: experiences
  cancel-in-progress: false

jobs:
  labo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      # PyTorch (version processeur, plus légère) : seulement pour le CNN du laboratoire
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Essais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Sur une PR et chaque mois : le re-test de l'IA de volatilité (seul modèle publié)
          EXPERIENCES: ${{ inputs.experiences || 'risque_volatilite' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python experiences.py
