name: Sync Thésée — Supabase

# Déclenchement automatique + possibilité de lancer manuellement depuis l'onglet Actions
on:
  schedule:
    # Les 3 passages du jour (10:00, 13:00 et 16:30 à New York) sont lancés à l'heure par
    # Supabase (workflow_dispatch, supabase_schema.sql V16). Ici, un seul passage de secours :
    # les tâches planifiées de GitHub démarraient 7 à 9 heures en retard.
    - cron: "30 21 * * 1-5"  # secours quotidien, après la clôture
  workflow_dispatch:          # bouton "Run workflow" manuel dans l'onglet Actions
    inputs:
      forcer_sec:
        description: "Recharger les comptes SEC maintenant (sinon une fois par semaine)"
        type: boolean
        default: false

# Jamais deux synchronisations en même temps (écritures concurrentes dans Supabase)
concurrency:
  group: sync-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Installation Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"

      - name: Installation des dépendances
        run: pip install -r requirements.txt -c requirements-lock.txt

      - name: Exécution de la synchronisation
        env:
          # SUPABASE_KEY doit être la clé "service_role" : depuis l'activation de
          # RLS (supabase_schema.sql), la clé "anon" ne peut plus écrire.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Comptes officiels SEC (valorisation, une fois par semaine) : contact exigé par la SEC
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_FORCER: ${{ inputs.forcer_sec && '1' || '0' }}
        run: python cron_sync.py

  # GitHub désactive automatiquement les workflows planifiés après 60 jours sans
  # commit sur le dépôt (c'est ce qui a arrêté la synchro le 23/09/2026).
  # Ce job ré-active le workflow via l'API GitHub, sans créer de commit.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Appel direct à l'API GitHub (pas d'action tierce : celle utilisée avant
      # était bloquée par GitHub, « Repository access blocked »).
      - name: Réactiver le workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
          # Re-test mensuel de l'IA de volatilité : même risque de désactivation
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/experiences.yml/enable"
